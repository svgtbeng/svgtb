<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Уроки svgtb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
/* Каталог уроков: коллаж из рваной бумаги, как в самих уроках */
:root{
  --bg:#bcd8f2; --paper:#fbf7ee; --card:#ffffff; --ink:#0b1d51; --muted:#5d5b66; --navy:#0b1d51;
  --yellow:#ffc20e; --blue:#1f45b8; --sky:#9bbcf2; --on:#0b1d51; --line:#0b1d51; --ok:#b9efd3;
  --display:'Unbounded','Onest',system-ui,sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1330;--paper:#101c47;--card:#182a63;--ink:#f4efe6;--muted:#b9b4c4;--line:#f4efe6;--ok:#1d6b4b}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1330;--paper:#101c47;--card:#182a63;--ink:#f4efe6;--muted:#b9b4c4;--line:#f4efe6;--ok:#1d6b4b}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.55;color:var(--ink);background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.t1{clip-path:polygon(0 10px,4% 0,9% 7px,15% 1px,22% 9px,30% 1px,38% 8px,47% 0,55% 7px,63% 1px,72% 9px,80% 0,88% 7px,95% 1px,100% 6px,calc(100% - 4px) 12%,100% 25%,calc(100% - 5px) 40%,100% 55%,calc(100% - 4px) 70%,100% 85%,calc(100% - 3px) 100%,95% calc(100% - 8px),88% 100%,80% calc(100% - 7px),72% 100%,63% calc(100% - 9px),55% 100%,47% calc(100% - 8px),38% 100%,30% calc(100% - 7px),22% 100%,15% calc(100% - 9px),9% 100%,4% calc(100% - 7px),0 100%,4px 86%,0 72%,5px 58%,0 44%,4px 30%,0 15%)}
.t2{clip-path:polygon(0 0,6% 8px,13% 0,21% 7px,29% 1px,37% 9px,46% 1px,54% 8px,62% 0,71% 8px,79% 1px,87% 8px,94% 0,100% 7px,calc(100% - 4px) 18%,100% 33%,calc(100% - 4px) 48%,100% 63%,calc(100% - 5px) 78%,100% 92%,100% 100%,93% calc(100% - 8px),85% 100%,77% calc(100% - 8px),68% 100%,60% calc(100% - 9px),51% 100%,43% calc(100% - 7px),34% 100%,26% calc(100% - 8px),18% 100%,10% calc(100% - 8px),3% 100%,0 calc(100% - 7px),4px 82%,0 66%,5px 50%,0 34%,4px 18%)}
.top{background:var(--navy);color:#fff;border-bottom:5px solid var(--yellow)}
.top .wrap{padding-block:12px;font-family:var(--display);font-weight:800;font-size:17px}
.top span{color:var(--yellow)}
.hero{background:var(--yellow);color:var(--on);margin-top:34px;padding:30px 28px 34px;transform:rotate(-.6deg)}
.hero h1{font-size:clamp(32px,6vw,56px);font-weight:800}
.hero p{margin:12px 0 0;font-size:18px;max-width:46ch}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin:40px 0 0;padding:0;list-style:none}
.lesson{background:var(--paper);padding:26px 22px 24px;display:flex;flex-direction:column;gap:12px;min-height:180px}
.lesson:nth-child(3n+1){transform:rotate(-.8deg)}.lesson:nth-child(3n+2){transform:rotate(.6deg)}
.num{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lesson h2{font-size:21px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.lesson h2 a{text-decoration:none}
.lesson h2 a::after{content:"";position:absolute;inset:0}
.lesson{position:relative}
.actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.go{display:inline-block;background:var(--blue);color:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 16px;font-weight:700;text-decoration:none;position:relative;z-index:1}
.copy{position:relative;z-index:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.copy.done{background:var(--ok)}
.state{margin:18px 0 0;color:var(--muted);font-size:15px}
footer{margin:60px 0 40px}
.foot{background:var(--navy);color:#fff;padding:22px 26px;font-family:var(--display);font-weight:800;font-size:18px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">svgtb · <span>English</span></div></header>
<main class="wrap">
  <section class="hero t1">
    <h1>Уроки английского</h1>
    <p>Выбери урок. Всё работает прямо в браузере: озвучка, задания и прогресс. Отвечать голосом можно в Chrome и Safari.</p>
  </section>
  <ul class="list" id="list"></ul>
  <p class="state" id="state"></p>
</main>
<footer class="wrap"><div class="foot t2">© Софья svgtb, ваш препод</div></footer>
<script>
/* Список уроков собирается сам из файлов репозитория на GitHub.
   Новый урок появится здесь, как только его .html загружен в репозиторий. */
const OWNER = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : 'svgtbeng';
const REPO = (location.pathname.split('/').filter(Boolean)[0]) || 'svgtb';
const KNOWN = [ // запасной список, если GitHub не ответит
  {file:'hello english.html', title:'Hello, English!'},
  {file:'past simple.html', title:'Back in Time — Past Simple'},
  {file:'climate.html', title:'Climate · Unit 2 — Present Perfect'}
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlOf = f => new URL(encodeURIComponent(f), location.href.replace(/[^/]*$/, '')).href;
const pretty = f => f.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ').replace(/^./, c => c.toUpperCase());

function render(items){
  document.getElementById('list').innerHTML = items.map((it, i) => `
    <li class="lesson ${i % 2 ? 't2' : 't1'}">
      <h2><a href="${esc(urlOf(it.file))}">${esc(it.title || pretty(it.file))}</a></h2>
      <div class="actions">
        <a class="go" href="${esc(urlOf(it.file))}">Открыть →</a>
        <button class="copy" type="button" data-url="${esc(urlOf(it.file))}">Скопировать ссылку</button>
      </div>
    </li>`).join('');
}

async function titleOf(file){
  try{
    const res = await fetch(urlOf(file), {headers:{Range:'bytes=0-8191'}});
    if (!res.ok) return '';
    const reader = res.body.getReader(); let buf = new Uint8Array(0);
    while (buf.length < 8192){ const {done, value} = await reader.read(); if (done) break; const n = new Uint8Array(buf.length + value.length); n.set(buf); n.set(value, buf.length); buf = n; }
    try{ reader.cancel() }catch(e){}
    const m = new TextDecoder().decode(buf).match(/<title>([\s\S]*?)<\/title>/i);
    return m ? m[1].trim() : '';
  }catch(e){ return '' }
}

async function load(){
  const known = Object.fromEntries(KNOWN.map(k => [k.file, k.title]));
  let cache = {}; try{ cache = JSON.parse(localStorage.getItem('svgtb-titles') || '{}') }catch(e){}
  try{
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
    if (!res.ok) throw new Error(res.status);
    const files = (await res.json()).filter(f => f.type === 'file' && /\.html?$/i.test(f.name) && f.name.toLowerCase() !== 'index.html');
    const items = files.map(f => ({file:f.name, sha:f.sha, title:(cache[f.name] && cache[f.name].sha === f.sha) ? cache[f.name].title : (known[f.name] || '')}));
    render(items);
    for (const it of items){
      if (cache[it.file] && cache[it.file].sha === it.sha) continue;
      const t = await titleOf(it.file); if (t) it.title = t;
      cache[it.file] = {sha:it.sha, title:it.title};
    }
    render(items);
    try{ localStorage.setItem('svgtb-titles', JSON.stringify(cache)) }catch(e){}
    document.getElementById('state').textContent = items.length ? '' : 'Пока здесь нет уроков.';
  }catch(e){
    document.getElementById('state').textContent = 'Не удалось обновить список с GitHub, показаны уроки, которые были раньше.';
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const u = b.dataset.url; let ok = false;
  try{ await navigator.clipboard.writeText(u); ok = true }catch(err){
    try{ const ta = document.createElement('textarea'); ta.value = u; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove() }catch(_){}
  }
  b.textContent = ok ? 'Ссылка скопирована' : u; b.classList.toggle('done', ok);
  if (ok) setTimeout(() => { b.textContent = 'Скопировать ссылку'; b.classList.remove('done') }, 2000);
});

render(KNOWN);
load();
</script>
</body>
</html>
