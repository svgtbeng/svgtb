const FIXED_AUDIO_SEQ = {};
const fixedAudioPool = {};
let audioRun = new AbortController();
function fixedAudio(key){
 if(!FIXED_AUDIO_SOURCES[key])throw new Error('Missing audio source: '+key);
 if(!fixedAudioPool[key]){const a=new Audio(FIXED_AUDIO_SOURCES[key]);a.preload='metadata';fixedAudioPool[key]=a;}
 return fixedAudioPool[key];
}
function preloadFixedAudio(){Object.keys(FIXED_AUDIO_SOURCES).forEach(k=>{try{fixedAudio(k).load()}catch(e){}});}
function stopAllAudio(){
 audioRun.abort();
 Object.values(fixedAudioPool).forEach(a=>a.pause());
 audioRun=new AbortController();
}
function audioCancelled(){return new DOMException('Playback cancelled','AbortError');}
function assertAudioRun(signal){if(signal.aborted)throw audioCancelled();}
function waitAudioMeta(a,signal,timeout=15000){return new Promise((resolve,reject)=>{
 let timer;
 const cleanup=()=>{clearTimeout(timer);a.removeEventListener('loadedmetadata',ok);a.removeEventListener('error',bad);signal.removeEventListener('abort',abort);};
 const ok=()=>{cleanup();resolve();},bad=()=>{cleanup();reject(new Error('Audio metadata could not be loaded'));},abort=()=>{cleanup();reject(audioCancelled());};
 if(signal.aborted)return abort();
 if(a.readyState>=1)return ok();
 a.addEventListener('loadedmetadata',ok,{once:true});a.addEventListener('error',bad,{once:true});signal.addEventListener('abort',abort,{once:true});
 timer=setTimeout(bad,timeout);
});}
function audioGap(ms,signal){return new Promise((resolve,reject)=>{
 let timer;
 const abort=()=>{clearTimeout(timer);signal.removeEventListener('abort',abort);reject(audioCancelled());};
 if(signal.aborted)return abort();
 signal.addEventListener('abort',abort,{once:true});
 timer=setTimeout(()=>{signal.removeEventListener('abort',abort);resolve();},ms);
});}
async function playFixedClip(clip,rate=1,signal=audioRun.signal){
 assertAudioRun(signal);
 if(!clip)throw new Error('Missing recorded clip');
 const [key,start,end]=clip,a=fixedAudio(key);
 await waitAudioMeta(a,signal);assertAudioRun(signal);
 a.pause();a.playbackRate=rate;
 const st=start??0;
 if(!Number.isFinite(a.duration)||a.duration<=st||(end!=null&&end>a.duration+.05))throw new Error('Invalid audio clip boundaries: '+key);
 a.currentTime=st;
 return new Promise((resolve,reject)=>{
  let done=false,timer,raf;
  const finish=(error)=>{if(done)return;done=true;clearTimeout(timer);cancelAnimationFrame(raf);a.removeEventListener('ended',ended);a.removeEventListener('error',failed);signal.removeEventListener('abort',abort);a.pause();if(error)reject(error);else resolve();};
  const ended=()=>finish(),failed=()=>finish(new Error('Audio playback failed')),abort=()=>finish(audioCancelled());
  const watch=()=>{if(done)return;if(end!=null&&a.currentTime>=end-.015)return finish();raf=requestAnimationFrame(watch);};

  if(end!=null)watch();
  if(signal.aborted)return abort();
  try{Promise.resolve(a.play()).catch(finish);}catch(e){finish(e);}
 });
}
async function playFixedText(text,rate=1,signal=audioRun.signal){
 const spoken=plain(text);
 const parts=FIXED_AUDIO_SEQ[spoken];
 if(parts){for(let i=0;i<parts.length;i++){await playFixedClip(FIXED_AUDIO_MAP[parts[i]],rate,signal);if(i+1<parts.length)await audioGap(70,signal);}return;}
 return playFixedClip(FIXED_AUDIO_MAP[spoken],rate,signal);
}

async function playReply(i){
 const it=REPLY_LISTENING[i];if(!it)return;
 const ok=await say(it.t);
 if(!ok)return;
 unlockReply(i);
}
function unlockReply(i){
 ST.answers['heardReply'+i]=true;
 const card=document.querySelector(`[data-reply-card="${i}"]`);
 card?.querySelectorAll('[data-reply-answer]').forEach(b=>b.disabled=false);
 const transcript=card?.querySelector('[data-reply-transcript]');if(transcript)transcript.hidden=false;
}
function checkReply(btn){
 const i=+btn.dataset.replyAnswer,it=REPLY_LISTENING[i];if(!it||!ST.answers['heardReply'+i])return;
 const selected=btn.dataset.v,correct=selected===it.a;ST.answers['reply'+i]=selected;
 btn.closest('.opts').querySelectorAll('button').forEach(b=>b.classList.remove('sel','ok','bad'));
 btn.classList.add('sel',correct?'ok':'bad');
 const fb=document.querySelector('#reply-fb-'+i);fb.textContent=correct?T('correct'):T('again');fb.className='feedback '+(correct?'ok':'bad');
 if(correct)markDone('reply'+i);
}

function applyState(){document.body.classList.toggle('no-lat',!ST.lat);document.body.classList.toggle('no-tr',!ST.tr);document.querySelector('#langs').innerHTML=LANGS.map(k=>`<button class="${ST.lang===k?'on':''}" data-lang="${k}">${I18N[k].l}</button>`).join('');const pt=document.querySelector('#p-tr'),pl=document.querySelector('#p-lat'),pr=document.querySelector('#p-rate');pt.textContent=T('translation');pt.classList.toggle('on',ST.tr);pl.textContent=T('latin');pl.classList.toggle('on',ST.lat);pr.textContent=T('speed')+' '+ST.rate+'×';pr.classList.toggle('on',ST.rate<1);document.querySelectorAll('[data-i18n="teacher"]').forEach(e=>e.textContent=T('teacher'))}
function markDone(key){ST.done.add(key);updateProgress()}
function updateProgress(){const total=18,n=Math.min(total,ST.done.size),p=Math.round(n/total*100);document.querySelector('#fill').style.width=p+'%';document.querySelector('#ptxt').textContent=`${T('done')}: ${n} / ${total}`;const b=document.querySelector('#sumbar'),t=document.querySelector('#sumtxt');if(b)b.style.width=p+'%';if(t)t.textContent=p+'%'}
function setupCanvases(){document.querySelectorAll('canvas[data-canvas]').forEach(c=>{const i=+c.dataset.canvas,a=ABC[i],ctx=c.getContext('2d');function guide(){ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.globalAlpha=.15;ctx.fillStyle=getComputedStyle(document.body).color;ctx.font='56px Segoe Print, Comic Sans MS, cursive';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a[0]+'  '+a[1],c.width/2,c.height/2+2);ctx.restore()}guide();let drawing=false;const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]};const start=e=>{drawing=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault()};const move=e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.body).color;ctx.lineTo(x,y);ctx.stroke();e.preventDefault();markDone('write'+i)};const end=()=>drawing=false;c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);c._guide=guide})}
function clearCanvas(i){const c=document.querySelector(`canvas[data-canvas="${i}"]`);if(c&&c._guide)c._guide()}
function checkMC(btn){const id=btn.dataset.mc,i=btn.dataset.i,v=btn.dataset.v,a=btn.dataset.a;const wrap=btn.closest('.opts');wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel','ok','bad'));btn.classList.add('sel',v===a?'ok':'bad');const fb=document.querySelector(`#fb-${id}-${i}`);fb.textContent=v===a?T('correct'):T('again');fb.className='feedback '+(v===a?'ok':'bad');if(v===a)markDone(id+i)}
function checkPerson(btn){const i=+btn.dataset.i,kind=btn.dataset.personChoice,v=btn.dataset.v,p=PEOPLE[i],a=p[kind];btn.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel','ok','bad'));btn.classList.add('sel',v===a?'ok':'bad');const fb=document.querySelector(`#pfb-${i}`);const card=btn.closest('.person-card');const groups=[...card.querySelectorAll('[data-person-choice]')];const correctKinds=new Set(groups.filter(x=>x.classList.contains('ok')).map(x=>x.dataset.personChoice));if(v!==a){fb.textContent=T('again');fb.className='feedback bad'}else if(correctKinds.size===4){fb.textContent=T('correct')+' ✓';fb.className='feedback ok';markDone('person'+i)}}
async function playSeq(lines,gap=400,onPlayed=null){
 stopAllAudio();const signal=audioRun.signal,rate=ST.rate;
 try{
  for(let i=0;i<lines.length;i++){
   assertAudioRun(signal);
   const text=Array.isArray(lines[i])?lines[i][0]:lines[i];
   await playFixedText(text,rate,signal);if(onPlayed)onPlayed(i);
   if(i+1<lines.length)await audioGap(gap,signal);
  }
  assertAudioRun(signal);return true;
 }catch(e){audioError(e);return false;}
}

async function playAlphabet(){
 if(await playSeq(ABC.map(letter=>letter[2]),90))markDone('alphabet');
}
async function count(dir){
 const numbers=dir==='up'?NUMS:NUMS.slice().reverse();
 if(await playSeq(numbers.map(number=>number[1]),100))markDone('numbers'+dir);
}


document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.lang){stopAllAudio();ST.lang=t.dataset.lang;render();return}
 if(t.dataset.act==='translation'){ST.tr=!ST.tr;applyState();return}
 if(t.dataset.act==='latin'){ST.lat=!ST.lat;applyState();return}
 if(t.dataset.act==='rate'){ST.rate=ST.rate===1?.8:ST.rate===.8?.6:1;applyState();return}
 if(t.dataset.act==='clear'){stopAllAudio();ST.answers={};ST.done.clear();render();toast(ST.lang==='ru'?'Урок очищен':'Reset');return}
 if(t.dataset.goto){document.querySelector('#'+t.dataset.goto)?.scrollIntoView({block:'start'});return}
 if(t.dataset.say!=null){say(t.dataset.say);markDone('say'+t.dataset.say);return}
 if(t.dataset.mc){checkMC(t);return}
 if(t.dataset.personChoice){checkPerson(t);return}
 if(t.dataset.listenPlay){playListeningItem();return}
 if(t.dataset.listenAnswer!=null){const v=t.dataset.listenAnswer,a=LISTEN[listenIndex].t;document.querySelectorAll('[data-listen-answer]').forEach(x=>x.classList.remove('sel','ok','bad'));t.classList.add('sel',v===a?'ok':'bad');const f=document.querySelector('#listen-fb');f.textContent=v===a?T('correct'):T('again');f.className='feedback '+(v===a?'ok':'bad');if(v===a)markDone('listen'+listenIndex);return}
 if(t.dataset.listenNext){stopAllAudio();listenIndex=(listenIndex+1)%LISTEN.length;const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.clearCanvas!=null){clearCanvas(+t.dataset.clearCanvas);return}
 if(t.dataset.abcFilter){document.querySelectorAll('[data-abc-filter]').forEach(x=>x.classList.toggle('on',x===t));document.querySelectorAll('[data-letter-card]').forEach(c=>c.style.display=t.dataset.abcFilter==='all'||c.dataset.lesson==='1'?'':'none');return}
 if(t.dataset.abcPlay){playAlphabet();return}
 if(t.dataset.replyPlay!=null){playReply(+t.dataset.replyPlay);return}
 if(t.dataset.replyAnswer!=null){checkReply(t);return}
 if(t.dataset.replyAll){playSeq(REPLY_LISTENING.map(it=>it.t),400,unlockReply);return}
 if(t.dataset.audioStop){stopAllAudio();return}
 if(t.dataset.count){count(t.dataset.count);return}
});
window.addEventListener('beforeunload',stopAllAudio);
render();
